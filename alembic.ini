# A generic, single database configuration.

[alembic]
# Path to migration scripts
script_location = alembic

# SQLAlchemy database URL (replace `pymssql` with `pyodbc` if needed)
sqlalchemy.url = mssql+pymssql://sa:SportsApp123%21@localhost:1433/SportsApp_db

# Loggers configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
